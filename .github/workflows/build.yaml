---
name: Build

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: [apps/**]
  push:
    branches: [main]
    paths: [apps/**]
  schedule:
    # monthly rebuild: refreshes apk-added packages on images whose
    # upstream releases rarely; fast movers rebuild on FROM bumps anyway
    - cron: '0 5 1 * *'

permissions: {}

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [opencode, baikal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # image tags track the upstream version: an annotated *_VERSION env
      # (zip-download images) or the FROM pin (derived images)
      - name: Extract upstream version
        id: version
        env:
          APP: ${{ matrix.app }}
        run: |
          version=$(awk -F'[= ]' '/^(ENV|ARG) [A-Za-z0-9_]+_VERSION=/ {print $3; exit}' "apps/${APP}/Dockerfile")
          if [ -z "${version}" ]; then
            version=$(awk -F'[:@ ]' '/^FROM/ {print $3; exit}' "apps/${APP}/Dockerfile")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
