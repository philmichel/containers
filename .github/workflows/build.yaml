---
name: Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build (empty = all)
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths: [apps/**]
  push:
    branches: [main]
    paths: [apps/**]
  schedule:
    # monthly rebuild: refreshes apk-added packages on images whose
    # upstream releases rarely; fast movers rebuild on FROM bumps anyway
    - cron: '0 5 1 * *'

permissions: {}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # push/PR builds only apps whose directory changed; schedule and
      # dispatch (without an app input) rebuild everything
      - name: Detect changed apps
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          APP: ${{ inputs.app }}
        run: |
          all=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          case "$EVENT" in
            pull_request)
              candidates=$(git diff --name-only HEAD^1 HEAD -- apps | cut -d/ -f2 | sort -u)
              ;;
            push)
              if git cat-file -e "$BEFORE" 2>/dev/null; then
                candidates=$(git diff --name-only "$BEFORE" HEAD -- apps | cut -d/ -f2 | sort -u)
              else
                candidates="$all"
              fi
              ;;
            *)
              if [ -n "$APP" ]; then candidates="$APP"; else candidates="$all"; fi
              ;;
          esac
          apps=$(printf '%s\n' "$all" | grep -xF -f <(printf '%s\n' "$candidates") || true)
          echo "apps=$(printf '%s\n' "$apps" | jq -cRn '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # image tags track the upstream version: an annotated *_VERSION env
      # (zip-download images) or the FROM pin (derived images)
      - name: Extract upstream version
        id: version
        env:
          APP: ${{ matrix.app }}
        run: |
          version=$(awk -F'[= ]' '/^(ENV|ARG) [A-Za-z0-9_]+_VERSION=/ {print $3; exit}' "apps/${APP}/Dockerfile")
          if [ -z "${version}" ]; then
            version=$(awk -F'[:@ ]' '/^FROM/ {print $3; exit}' "apps/${APP}/Dockerfile")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
